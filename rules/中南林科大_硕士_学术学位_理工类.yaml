    align: both
    indent: {first_line_chars: 0}
    space_before: {lines: 1}
    space_after: {lines: 1}
    line_spacing: {type: single}
    number_gap: "  "         # 序号和标题间空 2 格
    number_style: arabic     # 模板正文实例为 "1  绪论"

  heading2:
    desc: 二级标题
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 15.0            # 小三
    bold: false
    outline_level: 2
    align: both
    indent: {first_line_chars: 0}
    space_before: {pt: 12}
    space_after: {pt: 12}
    line_spacing: {type: single}
    number_gap: "  "

  heading3:
    desc: 三级标题
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 14.0            # 四号
    bold: false
    outline_level: 3
    align: both
    indent: {first_line_chars: 0}
    space_before: {pt: 6}
    space_after: {pt: 6}
    line_spacing: {type: single}
    number_gap: "  "

  heading4:
    desc: 四级标题
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 12.0            # 小四
    bold: false
    outline_level: 4
    align: both
    indent: {first_line_chars: 0}
    space_before: {pt: 6}
    space_after: {pt: 6}
    line_spacing: {type: single}
    number_gap: "  "

  # ---- 正文 ----
  body:
    desc: 正文
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12.0            # 小四
    outline_level: null
    align: both
    indent: {first_line_chars: 2, left_chars: 0, right_chars: 0}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}

  footnote:
