    new_page: true
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 16.0            # 三号
    outline_level: 1
    align: center
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}
    blank_line_after: true

  reference_item:
    desc: 参考文献内容
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12.0
    align: both
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0, hanging: false}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}
    gap_after_number: 1      # 编号与内容间空 1 格

  appendix_title:
    desc: 附录标题
    new_page: true
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 16.0
    outline_level: 1
    align: center
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    line_spacing: {type: exact, value: 20.0}
    blank_line_after: true

  ack_title:
    desc: 致谢标题（两字间空 2 格）
    new_page: true
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 16.0
    outline_level: 1
    align: center
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    line_spacing: {type: exact, value: 20.0}
