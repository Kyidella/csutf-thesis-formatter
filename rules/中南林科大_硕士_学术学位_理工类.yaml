    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    line_spacing: {type: exact, value: 20.0}

  toc_entry_1:
    desc: 一级目录项
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 14.0            # 四号
    align: both
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    line_spacing: {type: exact, value: 20.0}

  toc_entry_2:
    desc: 二级目录项
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12.0
    align: both
    indent: {first_line_chars: 0, left_chars: 1, right_chars: 0}
    line_spacing: {type: exact, value: 20.0}

  toc_entry_3:
    desc: 三级目录项
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12.0
    align: both
    indent: {first_line_chars: 0, left_chars: 2, right_chars: 0}
    line_spacing: {type: exact, value: 20.0}

  toc_common:
    desc: 目录通用要求
    page_number_align: right
    leader: dot
    note: 正文修改后注意刷新目录保持一致

  # ---- 正文标题 ----
