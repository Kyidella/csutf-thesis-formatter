# 中南林业科技大学 硕士学位论文（学术学位 · 理工类）格式规则
#
# 来源：学校 2026-04-23 版模板 word/comments.xml 中的 39 条批注（规范正文）
#       + 模板正文的直接格式（用于交叉校验字号映射，已逐条核对一致）
#
# 字号换算：初42 小初36 一26 小一24 二22 小二18 三16 小三15 四14 小四12 五10.5 小五9
# 规范未覆盖的项，回退到 2025 年已通过答辩的样本（见 fallback 段）。

meta:
  school: 中南林业科技大学
  degree: 硕士
  degree_type: 学术学位
  discipline: 理工类
  template: 中南林科大_硕士_学术学位_理工类.docx
  spec_date: "2026-04-23"
  spec_source: word/comments.xml

page:
  size: A4
  width_mm: 210
  height_mm: 297
  margins_cm: { top: 2.5, bottom: 2.5, left: 3.0, right: 2.5 }
  header_margin_cm: 1.5
  footer_margin_cm: 1.5

# 页码：前置部分（摘要→目录）大写罗马数字，正文（绪论→文末）阿拉伯数字重新从 1 开始
# 前两条 formatter.plan_numbering 会读；其余几条尚未实现，见文件末尾 not_implemented。
pagination:
  front_matter: { num_fmt: upperRoman, restart_at: 1 }
  body:         { num_fmt: decimal,    restart_at: 1 }
  position: bottom-center
  font_en: Times New Roman
  size_pt: 9.0          # 小五
  decorate: none        # 页码两侧不加修饰线

# ---------------------------------------------------------------------------
# 样式规则
#   font_cn/font_en  中/西文字体
#   size_pt          字号（pt）
#   bold             加粗。**写了才会去动**：true 强制加粗，false 强制不加粗。
#                    必须给标题写上 false——Word 内置的 heading 2/3/4 自带加粗，
#                    不管它的话，我们把字体改成黑体反而叠了一层粗，比原稿还难看。
#   outline_level    大纲级别；null = 正文文本
#   line_spacing     {type: single|multiple|exact, value: <磅或倍数>}
#   space_*          段前/段后；{lines: n} 或 {pt: n}
# ---------------------------------------------------------------------------
styles:

  # ---- 封面 ----
  cover_classification:
    desc: 分类号、密级
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12.0            # 小四
    align: both
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    space_before: {lines: 1}
    space_after: {lines: 0}
    line_spacing: {type: multiple, value: 1.2}

  cover_school_code:
    desc: 学校代号、学号
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12.0
    align: both
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    space_before: {pt: 10}
    space_after: {pt: 0}
    line_spacing: {type: multiple, value: 1.2}

  cover_degree_label:
    desc: 硕士学位论文
    font_cn: 黑体
    font_en: null
    size_pt: 26.0            # 一号
    align: center
    indent: {first_line_chars: 0}
    space_before: {lines: 1}
    space_after: {lines: 0}
    line_spacing: {type: single}

  cover_title:
    desc: 题目
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 24.0            # 小一
    align: center
    indent: {first_line_chars: 0}
    space_before: {pt: 0}
    space_after: {pt: 0}
    line_spacing: {type: single}
    max_chars: 25
    note: 应位于横线中间部分

  cover_subtitle:
    desc: 副标题
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 18.0            # 小二
    align: center
    indent: {first_line_chars: 0}
    space_before: {pt: 0}
    space_after: {pt: 0}
    line_spacing: {type: single}

  cover_fields:
    desc: 封面填写内容（作者姓名/导师/学院/学科/方向/日期）
    font_cn: 楷体
    font_en: Times New Roman
    size_pt: 14.0            # 四号
    align: left
    indent: {first_line_chars: 6}
    space_before: {pt: 0}
    space_after: {pt: 0}
    line_spacing: {type: exact, value: 25.0}

  cover_en_title:
    desc: 英文题目
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 15.0            # 小三
    align: center
    indent: {first_line_chars: 0}
    space_before: {pt: 0}
    space_after: {pt: 0}
    line_spacing: {type: multiple, value: 1.6}
    note: 每个实词首字母大写

  cover_en_field:
    desc: 作者英文姓名 / 学科门类 / Supervisor
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 14.0            # 四号
    align: center
    indent: {first_line_chars: 0}
    space_before: {pt: 0}
    space_after: {pt: 0}
    line_spacing: {type: multiple, value: 1.5}
    examples: [王五一 WANG Wuyi, 张三 ZHANG San, Agronomy（农学）]

  cover_date:
    desc: 日期
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 14.0
    align: center
    indent: {first_line_chars: 0}
    space_before: {pt: 0}
    space_after: {pt: 0}
    line_spacing: {type: single}

  # ---- 摘要 ----
  abstract_title:
    desc: 摘要（两字间空 2 格）
    new_page: true
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 18.0            # 小二
    outline_level: 1
    align: center
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}
    blank_line_after: true

  abstract_body:
    desc: 中文摘要内容
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12.0            # 小四
    outline_level: null
    align: both
    indent: {first_line_chars: 2, left_chars: 0, right_chars: 0}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}
    word_count: 800

  abstract_keywords:
    desc: 关键词
    font_cn: 黑体
    font_en: Times New Roman
    size_pt: 12.0
    outline_level: null
    align: both
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}
    label: "关键词："
    label_font: 黑体
    separator: "；"          # 全角分号，最后一个词后不加标点
    count_range: [3, 8]
    blank_line_before: true

  abstract_en_title:
    desc: ABSTRACT
    new_page: true
    font_cn: null
    font_en: Times New Roman
    size_pt: 18.0
    bold: true
    outline_level: 1
    align: center
    indent: {first_line_chars: 0}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}
    blank_line_after: true

  abstract_en_body:
    desc: 英文摘要内容
    font_cn: 宋体
    font_en: Times New Roman
    size_pt: 12.0
    outline_level: null
    align: both
    indent: {first_line_chars: 2}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}
    note: 英文标点符号后应有一个半角空格

  abstract_en_keywords:
    desc: Keywords
    font_cn: null
    font_en: Times New Roman
    size_pt: 12.0
    outline_level: null
    align: both
    indent: {first_line_chars: 0, left_chars: 0, right_chars: 0}
    space_before: {lines: 0}
    space_after: {lines: 0}
    line_spacing: {type: exact, value: 20.0}
